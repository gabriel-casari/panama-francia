<style>
  :root{
    --ground:#ECEEF1;
    --card:#FFFFFF;
    --ink:#182031;
    --muted:#5C6879;
    --line:rgba(24,32,49,.12);
    --accent:#D4614A;
    --shadow:0 1px 2px rgba(24,32,49,.06), 0 8px 24px -12px rgba(24,32,49,.28);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0F1420;
      --card:#171E2C;
      --ink:#E7EBF1;
      --muted:#94A0B3;
      --line:rgba(231,235,241,.14);
      --accent:#E8785E;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0F1420;
    --card:#171E2C;
    --ink:#E7EBF1;
    --muted:#94A0B3;
    --line:rgba(231,235,241,.14);
    --accent:#E8785E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--ui);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{
    max-width:34rem;
    margin:0 auto;
    padding:clamp(1.25rem,5vw,2.5rem) clamp(1rem,4vw,1.5rem) 3rem;
    display:flex;
    flex-direction:column;
    gap:1.5rem;
  }

  header{display:flex;flex-direction:column;gap:.4rem}
  .eyebrow{
    margin:0;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);font-weight:600;
  }
  h1{
    margin:0;font-family:var(--serif);font-weight:400;
    font-size:clamp(1.9rem,7vw,2.6rem);line-height:1.1;text-wrap:balance;
  }
  h1 .sep{color:var(--accent)}
  .lede{margin:0;color:var(--muted);font-size:.95rem}
  .lede b{color:var(--ink);font-weight:600}

  .clocks{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
  .clock{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:.9rem .9rem 1rem;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:.15rem;position:relative;overflow:hidden;
  }
  .clock::before{
    content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--sky,var(--line));
  }
  .clock h2{
    margin:.15rem 0 .2rem;font-family:var(--serif);font-weight:400;
    font-size:1rem;letter-spacing:.01em;
  }
  .t{
    margin:0;
    font-family:var(--mono);font-variant-numeric:tabular-nums;
    font-size:clamp(1.9rem,9vw,2.5rem);line-height:1;letter-spacing:-.02em;
    display:flex;align-items:baseline;gap:.2rem;
  }
  .t .mer{font-size:.4em;color:var(--muted);letter-spacing:.04em}
  .d{margin:.45rem 0 0;font-size:.78rem;color:var(--muted);line-height:1.35}
  .z{margin:.15rem 0 0;font-size:.68rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:1rem .9rem 1.1rem;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:.85rem;
  }
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:1rem}
  .panel-head h3{
    margin:0;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);font-weight:600;
  }
  button#now{
    font:inherit;font-size:.78rem;font-weight:600;
    color:var(--accent);background:transparent;
    border:1px solid var(--accent);border-radius:999px;
    padding:.3rem .8rem;cursor:pointer;
  }
  button#now[aria-pressed="true"]{background:var(--accent);color:var(--card);border-color:var(--accent)}
  button#now:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .bars{position:relative;display:flex;flex-direction:column;gap:.55rem;touch-action:none}
  .row{display:flex;flex-direction:column;gap:.25rem}
  .row .name{font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  .bar{height:26px;border-radius:6px;border:1px solid var(--line);overflow:hidden}
  .ticks{
    position:relative;height:.9rem;font-family:var(--mono);font-size:.6rem;
    color:var(--muted);font-variant-numeric:tabular-nums;
  }
  .ticks span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .playhead{
    position:absolute;top:0;bottom:0;width:2px;background:var(--accent);
    transform:translateX(-1px);pointer-events:none;border-radius:2px;
  }
  .playhead::after{
    content:"";position:absolute;top:-4px;left:50%;width:10px;height:10px;
    margin-left:-5px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 3px var(--card);
  }
  .overlap{
    position:absolute;top:0;bottom:0;border-left:1px dashed var(--accent);
    border-right:1px dashed var(--accent);opacity:.6;pointer-events:none;
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:22px;
    background:transparent;margin:0;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
    background:var(--accent);border:3px solid var(--card);margin-top:-9px;
    box-shadow:0 1px 4px rgba(0,0,0,.3);
  }
  input[type=range]::-moz-range-thumb{
    width:22px;height:22px;border-radius:50%;background:var(--accent);
    border:3px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.3);
  }
  input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

  .hint{margin:0;font-size:.8rem;color:var(--muted);line-height:1.5}
  .hint b{color:var(--ink);font-weight:600}
  .hint .sw{
    display:inline-block;width:.6rem;height:.6rem;border-radius:2px;
    border:1px dashed var(--accent);margin-right:.35rem;
  }

  footer{font-size:.72rem;color:var(--muted);line-height:1.5;text-align:center}

  .nojs{
    background:var(--card);border:1px solid var(--accent);border-radius:14px;
    padding:1rem;box-shadow:var(--shadow);font-size:.85rem;line-height:1.55;
  }
  .nojs b{display:block;margin-bottom:.3rem;font-size:.92rem}
</style>
<style>
  body{min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
</style>

<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Diferencia horaria</p>
    <h1>Panamá <span class="sep">⇄</span> Francia</h1>
    <p class="lede" id="diff">Calculando…</p>
  </header>

  <noscript>
    <p class="nojs">
      <b>Esto no es Safari.</b>
      Estás viendo el archivo en el previsualizador de WhatsApp o de Archivos, que no ejecuta
      JavaScript, así que los relojes no pueden calcularse. Abrí la página en Safari y funciona.
    </p>
  </noscript>

  <section class="clocks">
    <article class="clock" id="c-pa">
      <h2>Panamá</h2>
      <p class="t"><span id="pa-t">--:--</span><span class="mer" id="pa-m"></span></p>
      <p class="d" id="pa-d"></p>
      <p class="z" id="pa-z"></p>
    </article>
    <article class="clock" id="c-fr">
      <h2>Francia</h2>
      <p class="t"><span id="fr-t">--:--</span><span class="mer" id="fr-m"></span></p>
      <p class="d" id="fr-d"></p>
      <p class="z" id="fr-z"></p>
    </article>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h3>Desliza para convertir</h3>
      <button id="now" type="button" aria-pressed="true">Ahora</button>
    </div>

    <div class="bars" id="bars">
      <div class="row">
        <span class="name">Panamá</span>
        <div class="bar" id="bar-pa"></div>
        <div class="ticks" id="tk-pa"></div>
      </div>
      <div class="row">
        <span class="name">Francia</span>
        <div class="bar" id="bar-fr"></div>
        <div class="ticks" id="tk-fr"></div>
      </div>
      <div class="playhead" id="head"></div>
      <div class="overlap" id="ovl"></div>
    </div>

    <input type="range" id="slider" min="0" max="1439" step="5" value="0" aria-label="Hora en Panamá">

    <p class="hint" id="hint"></p>
  </section>

  <footer>Se ajusta solo cuando Francia cambia al horario de verano. Panamá no cambia nunca.</footer>
</div>

<script>
(function(){
  var PA = "America/Panama", FR = "Europe/Paris";

  var SKY = ["#1B2440","#1B2440","#1B2440","#1E2848","#33406B","#7A6A82","#E08A5B",
             "#C9D9EA","#A9C8DF","#B4D0E5","#CFE2F0","#D6E7F3","#D9E9F4","#D6E7F3",
             "#CFE2F0","#BCD6E9","#A9C8DF","#D89A73","#C96A55","#7A5A78","#3A4468",
             "#222C4C","#1B2440","#1B2440"];

  function parts(inst, tz){
    var f = new Intl.DateTimeFormat("en-US",{timeZone:tz,hour12:false,
      year:"numeric",month:"2-digit",day:"2-digit",
      hour:"2-digit",minute:"2-digit",second:"2-digit"});
    var o = {};
    f.formatToParts(inst).forEach(function(p){ o[p.type] = p.value; });
    if(o.hour === "24") o.hour = "00";
    return o;
  }
  function offsetMs(inst, tz){
    var p = parts(inst, tz);
    var asUTC = Date.UTC(+p.year, +p.month-1, +p.day, +p.hour, +p.minute, +p.second);
    return asUTC - Math.floor(inst/1000)*1000;
  }
  function instantOf(tz, y, mo, d, h, mi){
    var g = Date.UTC(y, mo-1, d, h, mi);
    var i = g - offsetMs(g, tz);
    return g - offsetMs(i, tz);
  }
  function localHour(inst, tz){
    var p = parts(inst, tz);
    return +p.hour + (+p.minute)/60;
  }
  function zoneAbbr(inst, tz){
    try{
      var f = new Intl.DateTimeFormat("en-US",{timeZone:tz,timeZoneName:"short"});
      var v = f.formatToParts(inst).filter(function(p){ return p.type === "timeZoneName"; })[0];
      return v ? v.value : "";
    }catch(e){ return ""; }
  }
  function fmtClock(inst, tz){
    var p = parts(inst, tz);
    var h = +p.hour;
    var h12 = h % 12; if(h12 === 0) h12 = 12;
    return { hm: h12 + ":" + p.minute, mer: h < 12 ? "AM" : "PM" };
  }
  function fmtDate(inst, tz){
    var s = new Intl.DateTimeFormat("es",{timeZone:tz,weekday:"long",day:"numeric",month:"long"}).format(inst);
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function gradientFor(baseInst, tz){
    var stops = [];
    for(var i=0;i<24;i++){
      var c = SKY[Math.floor(localHour(baseInst + i*3600000, tz)) % 24];
      stops.push(c + " " + (i/24*100).toFixed(4) + "% " + ((i+1)/24*100).toFixed(4) + "%");
    }
    return "linear-gradient(90deg," + stops.join(",") + ")";
  }
  function ticksFor(baseInst, tz, el){
    var html = "";
    for(var i=0;i<24;i+=4){
      var p = parts(baseInst + i*3600000, tz);
      html += '<span style="left:' + ((i+0.5)/24*100).toFixed(3) + '%">' + p.hour + 'h</span>';
    }
    el.innerHTML = html;
  }

  var slider = document.getElementById("slider");
  var head   = document.getElementById("head");
  var ovl    = document.getElementById("ovl");
  var btnNow = document.getElementById("now");
  var bars   = document.getElementById("bars");

  var live = true, dayBase = 0, current = 0;

  function setDayFrom(inst){
    var p = parts(inst, PA);
    dayBase = instantOf(PA, +p.year, +p.month, +p.day, 0, 0);
  }

  function paint(){
    var inst = current;

    var a = fmtClock(inst, PA), b = fmtClock(inst, FR);
    document.getElementById("pa-t").textContent = a.hm;
    document.getElementById("pa-m").textContent = a.mer;
    document.getElementById("fr-t").textContent = b.hm;
    document.getElementById("fr-m").textContent = b.mer;
    document.getElementById("pa-d").textContent = fmtDate(inst, PA);
    document.getElementById("fr-d").textContent = fmtDate(inst, FR);
    document.getElementById("pa-z").textContent = zoneAbbr(inst, PA);
    document.getElementById("fr-z").textContent = zoneAbbr(inst, FR);
    document.getElementById("c-pa").style.setProperty("--sky", SKY[Math.floor(localHour(inst,PA))%24]);
    document.getElementById("c-fr").style.setProperty("--sky", SKY[Math.floor(localHour(inst,FR))%24]);

    var diff = Math.round((offsetMs(inst,FR) - offsetMs(inst,PA))/60000);
    var hh = Math.floor(Math.abs(diff)/60), mm = Math.abs(diff)%60;
    var txt = hh + (mm ? ":" + ("0"+mm).slice(-2) : "") + (hh === 1 && !mm ? " hora" : " horas");
    document.getElementById("diff").innerHTML =
      "En Francia van <b>" + txt + "</b> " + (diff >= 0 ? "adelante" : "atrás") + " de Panamá.";

    document.getElementById("bar-pa").style.background = gradientFor(dayBase, PA);
    document.getElementById("bar-fr").style.background = gradientFor(dayBase, FR);
    ticksFor(dayBase, PA, document.getElementById("tk-pa"));
    ticksFor(dayBase, FR, document.getElementById("tk-fr"));

    var frac = Math.max(0, Math.min(1, (inst - dayBase) / 86400000));
    head.style.left = (frac*100).toFixed(4) + "%";

    var s = -1, e = -1;
    for(var m=0;m<=1440;m+=10){
      var t = dayBase + m*60000;
      var ha = localHour(t,PA), hb = localHour(t,FR);
      if(ha >= 7 && ha < 23 && hb >= 7 && hb < 23){
        if(s < 0) s = m;
        e = m;
      }
    }
    if(s >= 0){
      e = Math.min(1440, e + 10);
      ovl.style.display = "block";
      ovl.style.left  = (s/1440*100).toFixed(3) + "%";
      ovl.style.width = ((e-s)/1440*100).toFixed(3) + "%";
      var sa = fmtClock(dayBase+s*60000, PA), ea = fmtClock(dayBase+e*60000, PA);
      var sb = fmtClock(dayBase+s*60000, FR), eb = fmtClock(dayBase+e*60000, FR);
      document.getElementById("hint").innerHTML =
        '<span class="sw"></span>Los dos despiertos: <b>' + sa.hm + ' ' + sa.mer + ' – ' + ea.hm + ' ' + ea.mer +
        '</b> en Panamá = <b>' + sb.hm + ' ' + sb.mer + ' – ' + eb.hm + ' ' + eb.mer + '</b> en Francia.';
    } else {
      ovl.style.display = "none";
      document.getElementById("hint").textContent = "";
    }
  }

  function selectMinute(m, fromUser){
    m = Math.max(0, Math.min(1439, m));
    slider.value = m;
    current = dayBase + m*60000;
    if(fromUser){ live = false; btnNow.setAttribute("aria-pressed","false"); }
    paint();
  }

  function goLive(){
    live = true;
    btnNow.setAttribute("aria-pressed","true");
    var n = Date.now();
    setDayFrom(n);
    current = n;
    slider.value = Math.round((n - dayBase)/60000);
    paint();
  }

  slider.addEventListener("input", function(){ selectMinute(+slider.value, true); });
  btnNow.addEventListener("click", goLive);

  function fromPointer(ev){
    var r = bars.getBoundingClientRect();
    var x = ev.clientX - r.left;
    selectMinute(Math.round(x / r.width * 1440 / 5) * 5, true);
  }
  var dragging = false;
  bars.addEventListener("pointerdown", function(e){ dragging = true; bars.setPointerCapture(e.pointerId); fromPointer(e); });
  bars.addEventListener("pointermove", function(e){ if(dragging) fromPointer(e); });
  bars.addEventListener("pointerup", function(){ dragging = false; });
  bars.addEventListener("pointercancel", function(){ dragging = false; });

  goLive();
  setInterval(function(){ if(live) goLive(); }, 1000);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden && live) goLive(); });
})();
</script>
</body>
</html>
